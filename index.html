function loadQuiz() {
  const container = document.getElementById("quiz-container");
  quizData.forEach((item, index) => {
    const block = document.createElement("div");
    block.className = "question";
    block.innerHTML = `<p><strong>Q${index + 1}.</strong> ${item.question}</p>`;
    item.options.forEach((opt, i) => {
      block.innerHTML += `<label><input type="radio" name="q${index}" value="${i}"> ${opt}</label>`;
    });
    block.innerHTML += `<div id="explain${index}" class="explanation"></div>`;
    container.appendChild(block);
  });
}

function loadQuiz() {
  const container = document.getElementById("quiz-container");
  quizData.forEach((item, idx) => {
    const qDiv = document.createElement("div");
    qDiv.className = "question";
    qDiv.innerHTML = `<p><strong>Q${idx+1}.</strong> ${item.question}</p>`;
    item.options.forEach((opt, i) => {
      qDiv.innerHTML += `
        <label>
          <input type="checkbox" name="q${idx}" value="${i}">
          ${opt}
        </label>`;
    });
    qDiv.innerHTML += `<div id="explain${idx}" class="explanation"></div>`;
    container.appendChild(qDiv);
  });
}

function calculateScore() {
  let score = 0;
  quizData.forEach((item, idx) => {
    const selected = Array.from(
      document.querySelectorAll(`input[name="q${idx}"]:checked`)
    ).map(el => +el.value).sort();
    const correct = item.answer.slice().sort();
    const explanationBox = document.getElementById(`explain${idx}`);
    if (JSON.stringify(selected) === JSON.stringify(correct)) {
      score++;
      explanationBox.innerHTML = "✅ Bonne réponse !<br>" + item.explanation;
      explanationBox.style.color = "green";
    } else {
      explanationBox.innerHTML = "❌ Mauvaise réponse.<br>" + item.explanation;
      explanationBox.style.color = "red";
    }
  });
  document.getElementById("score").innerHTML = `<h3>Résultat : ${score} / ${quizData.length}</h3>`;
}
